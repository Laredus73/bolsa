name: Listas de bolsa semanales


on:
  schedule:
   - cron: '0 7 * * 1-5'

  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install yfinance pandas lxml requests
      - name: Generar listas
        run: python sistema.py
      - name: Publicar informe
        run: |
          mkdir -p public
          cp informe.html public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: 
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4



